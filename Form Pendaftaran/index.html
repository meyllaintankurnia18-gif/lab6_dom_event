
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Workshop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="tag">WORKSHOP 2026</span>
            <h1>Daftar Workshop</h1>
            <p>Kembangkan kemampuan dan pengetahuanmu bersama kami!</p>
        </div>

        <div class="content">
            <form id="workshopForm">

                <div class="form-group">
                    <label for="nama">Nama Lengkap</label>
                    <input type="text" id="nama"
                        placeholder="Masukkan nama lengkap">
                    <small id="namaCount">0/50 karakter</small>
                    <small class="error" id="namaError"></small>
                </div>

                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input type="email" id="email"
                        placeholder="contoh@email.com">
                    <small class="error" id="emailError"></small>
                </div>

                <div class="form-group">
                    <label for="sesi">Pilih Sesi Workshop</label>
                    <select id="sesi">
                        <option value="">-- Pilih Sesi --</option>
                        <option value="Sesi Pagi (09.00 - 11.00)">
                            Sesi Pagi (09.00 - 11.00)
                        </option>
                        <option value="Sesi Siang (13.00 - 15.00)">
                            Sesi Siang (13.00 - 15.00)
                        </option>
                        <option value="Sesi Sore (15.30 - 17.30)">
                            Sesi Sore (15.30 - 17.30)
                        </option>
                    </select>
                    <small class="error" id="sesiError"></small>
                </div>

                <div class="summary">
                    <h3>Ringkasan Pendaftaran</h3>
                    <p>Nama: <span id="previewNama">-</span></p>
                    <p>Email: <span id="previewEmail">-</span></p>
                    <p>Sesi: <span id="previewSesi">-</span></p>
                </div>

                <div id="message"></div>

                <div class="buttons">
                    <button type="submit" class="btn-submit">
                        Daftar Sekarang
                    </button>

                    <button type="reset" class="btn-reset">
                        Reset
                    </button>
                </div>

            </form>
        </div>

        <footer>
            © 2026 Workshop Registration. All Rights Reserved.
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
